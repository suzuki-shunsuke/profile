name: test (workflow_call)
on: workflow_call
jobs:
  build:
    uses: ./.github/workflows/wc-deploy.yaml
    permissions:
      contents: write
    with:
      is_deploy: false

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.64.0
    permissions:
      contents: read
      pull-requests: read
